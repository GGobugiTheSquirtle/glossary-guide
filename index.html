<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어나더에덴 도감 — Another Eden Database</title>
<meta name="description" content="어나더에덴 용어·약어 도감 — 게임 내 용어/약어/시스템 설명을 EN·KO·JP 동시 검색.">
<meta name="theme-color" content="#13131a">
<meta property="og:type" content="website">
<meta property="og:title" content="어나더에덴 도감 — Another Eden Database">
<meta property="og:description" content="어나더에덴 용어·약어를 EN·KO·JP 동시 검색하는 도감.">
<meta property="og:url" content="https://ggobugithesquirtle.github.io/glossary-guide/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root {
  --bg: #13131a;
  --surface: #1c1c28;
  --surface2: #262636;
  --surface3: #30304a;
  --border: #3a3a50;
  --accent: #7c6fe0;
  --accent2: #5b8dee;
  --gold: #e0c46a;
  --text: #e8e8f0;
  --text2: #9494a8;
  --text3: #6a6a80;
  --en: #a89cf0;
  --ko: #6ba3f0;
  --jp: #e07c8f;
  --fire: #E74C3C; --water: #3498DB; --wind: #2ECC71; --earth: #E67E22;
  --thunder: #F1C40F; --shade: #9B59B6; --crystal: #BDC3C7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

/* ── 헤더 ── */
header {
  background: linear-gradient(135deg, #0d0d1a 0%, #1a1a3e 40%, #0f2860 100%);
  border-bottom: 2px solid var(--accent);
  padding: 24px 16px 18px;
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 70% 20%, rgba(124,111,224,0.15), transparent 60%);
}
.header-inner { max-width: 1100px; margin: 0 auto; position: relative; }
h1 {
  font-size: 26px; font-weight: 800; letter-spacing: 0.02em;
  background: linear-gradient(90deg, #c0b0ff 0%, #7ec8e3 50%, #e0c46a 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.subtitle { color: var(--text2); font-size: 12px; }
.subtitle span { color: var(--text3); margin: 0 4px; }
.stats-bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.stat-chip {
  background: rgba(124,111,224,0.15);
  border: 1px solid rgba(124,111,224,0.3);
  border-radius: 16px; padding: 3px 12px;
  font-size: 11px; color: var(--text2);
}
.stat-chip b { color: var(--gold); }

/* ── 컨트롤 ── */
.controls {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(8px);
}
.controls-inner { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.search-row { display: flex; gap: 8px; align-items: center; }
.search-wrap { position: relative; flex: 1; }
.search-wrap input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px 9px 36px;
  color: var(--text); font-size: 14px;
  outline: none; transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,111,224,0.2); }
.search-wrap input::placeholder { color: var(--text3); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
.view-toggle { display: flex; gap: 0; }
.view-toggle button {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text3); padding: 7px 12px; cursor: pointer; font-size: 13px;
  transition: all 0.15s;
}
.view-toggle button:first-child { border-radius: 8px 0 0 8px; }
.view-toggle button:last-child { border-radius: 0 8px 8px 0; }
.view-toggle button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

.tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
.cbtn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 16px; padding: 4px 12px;
  color: var(--text2); font-size: 12px;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.cbtn:hover { border-color: var(--accent); color: var(--text); }
.cbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

.info-bar {
  max-width: 1100px; margin: 6px auto 0;
  padding: 0 16px; font-size: 11px; color: var(--text3);
}

/* ── 카드 그리드 (도감 뷰) ── */
.card-grid {
  max-width: 1100px; margin: 0 auto; padding: 12px 16px 60px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,111,224,0.15); }
.card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.card-icon {
  width: 36px; height: 36px;
  background: var(--surface2);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.card-icon img { width: 28px; height: 28px; image-rendering: pixelated; }
.card-icon .emoji { font-size: 20px; }
.card-titles { flex: 1; min-width: 0; }
.card-en { color: var(--en); font-weight: 700; font-size: 14px; line-height: 1.3; }
.card-abbr {
  display: inline-block; background: var(--surface3);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 0 5px; font-size: 10px; color: var(--gold);
  font-weight: 700; margin-left: 4px; vertical-align: middle;
}
.card-langs { display: flex; gap: 12px; margin-bottom: 6px; }
.card-lang { font-size: 12px; }
.card-lang .label { color: var(--text3); margin-right: 3px; font-size: 10px; }
.card-lang .ko { color: var(--ko); }
.card-lang .jp { color: var(--jp); }
.card-desc {
  color: var(--text2); font-size: 12px; line-height: 1.5;
  border-top: 1px solid var(--border); padding-top: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cat-badge {
  position: absolute; top: 10px; right: 10px;
  padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 600;
}
.cat-badge.battle   { background: #c0392b; color: #fff; }
.cat-badge.char     { background: #8e44ad; color: #fff; }
.cat-badge.weapon   { background: #f39c12; color: #fff; }
.cat-badge.equip    { background: #16a085; color: #fff; }
.cat-badge.dungeon  { background: #d35400; color: #fff; }
.cat-badge.system   { background: #2980b9; color: #fff; }
.cat-badge.story    { background: #27ae60; color: #fff; }
.cat-badge.location { background: #8d6e63; color: #fff; }
.cat-badge.meta     { background: #7f8c8d; color: #fff; }

/* ── 테이블 뷰 ── */
.tbl-wrap { max-width: 1100px; margin: 0 auto; padding: 8px 16px 60px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 58px; z-index: 50;
  background: var(--surface);
  color: var(--text2); font-size: 11px; font-weight: 600;
  text-align: left; padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; cursor: pointer; }
tbody tr:hover { background: var(--surface2); }
td { padding: 7px 8px; vertical-align: middle; font-size: 13px; }
.td-icon { width: 40px; text-align: center; }
.td-icon img { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: middle; }
.td-cat { width: 64px; }
.td-en { width: 180px; }
.td-ko { width: 130px; }
.td-jp { width: 110px; }
.term-en { color: var(--en); font-weight: 600; }
.term-ko { color: var(--ko); }
.term-jp { color: var(--jp); font-size: 12px; }
.desc-text { color: var(--text2); font-size: 12px; }

/* ── 모달 ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  justify-content: center; align-items: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 16px;
  max-width: 560px; width: 100%;
  max-height: 80vh; overflow-y: auto;
  padding: 24px;
  position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.modal-close {
  position: absolute; top: 12px; right: 14px;
  background: none; border: none;
  color: var(--text3); font-size: 24px;
  cursor: pointer; line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-icon-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.modal-icon {
  width: 52px; height: 52px;
  background: var(--surface2); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border);
}
.modal-icon img { width: 40px; height: 40px; image-rendering: pixelated; }
.modal-icon .emoji { font-size: 28px; }
.modal-title { flex: 1; }
.modal-en { font-size: 20px; font-weight: 800; color: var(--en); }
.modal-cat-badge { display: inline-block; margin-top: 2px; }
.modal-langs {
  background: var(--surface2); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 12px;
  display: grid; grid-template-columns: 32px 1fr; gap: 4px 8px; align-items: center;
}
.modal-langs .flag { font-size: 11px; color: var(--text3); font-weight: 600; }
.modal-langs .val-ko { color: var(--ko); font-size: 15px; font-weight: 600; }
.modal-langs .val-jp { color: var(--jp); font-size: 14px; }
.modal-langs .val-en { color: var(--text2); font-size: 13px; }
.modal-desc {
  color: var(--text); font-size: 14px; line-height: 1.7;
  margin-bottom: 12px;
}
.modal-related { border-top: 1px solid var(--border); padding-top: 10px; }
.modal-related h4 { font-size: 11px; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.related-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.related-tag {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 10px;
  font-size: 12px; color: var(--accent2);
  cursor: pointer; transition: all 0.12s;
}
.related-tag:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

.no-result { text-align: center; color: var(--text3); padding: 80px 20px; }
.no-result .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

@media (max-width: 680px) {
  .card-grid { grid-template-columns: 1fr; }
  .td-jp, .td-desc, thead th:nth-child(5), thead th:nth-child(6) { display: none; }
  .modal { padding: 18px; }
  h1 { font-size: 20px; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">

  </div>

    <div class="search-row">

      </div>
      <div class="view-toggle">
        <button class="on" onclick="setView('card',this)" title="도감 뷰">🃏</button>
        <button onclick="setView('table',this)" title="표 뷰">📋</button>
      </div>
    </div>
    <div class="tag-row" id="tags"></div>
  </div>
</div>

<div class="info-bar" id="info"></div>

<div class="card-grid" id="cardView"></div>
<div class="tbl-wrap" id="tableView" style="display:none">
  <table><thead><tr>
    <th></th><th>분류</th><th>English</th><th>한국어</th><th>日本語</th><th>설명</th>
  </tr></thead><tbody id="tbody"></tbody></table>
</div>
<div class="no-result" id="noResult" style="display:none">

</div>

<!-- 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="용어 상세"></div>

// ═══════════════════════════════════════════════════════════════
const CATS = {
  all:      { label:"전체",   icon:"📋" },
  battle:   { label:"전투",   icon:"⚔" },
  char:     { label:"캐릭터", icon:"👤" },
  weapon:   { label:"무기",   icon:"🗡" },
  equip:    { label:"장비",   icon:"🔮" },
  dungeon:  { label:"던전",   icon:"🏰" },
  system:   { label:"시스템", icon:"⚙" },
  story:    { label:"스토리", icon:"📖" },
  location: { label:"지역",   icon:"🗺" },
  meta:     { label:"일반",   icon:"ℹ" },
};
const CAT_LABELS = {};
for (const [k,v] of Object.entries(CATS)) if(k!=="all") CAT_LABELS[k] = v.label;

let curCat = "all", curView = "card";

// ── 아이콘 렌더 ──
function renderIcon(item, size) {
  const s = size || 28;
  if (!item.icon) return `<span class="emoji">${CATS[item.cat]?.icon||"📄"}</span>`;
  if (item.icon.startsWith("img:")) return `<img src="images/${item.icon.slice(4)}" width="${s}" height="${s}" alt="" loading="lazy">`;
  if (item.icon.startsWith("emoji:")) return `<span class="emoji">${item.icon.slice(6)}</span>`;
  return `<span class="emoji">📄</span>`;
}

// ── 초기화 ──
(function init() {
  const tagRow = document.getElementById("tags");
  for (const [key, val] of Object.entries(CATS)) {
    const cnt = key === "all" ? G.length : G.filter(r => r.cat === key).length;
    const btn = document.createElement("button");
    btn.className = "cbtn" + (key === "all" ? " on" : "");
    btn.dataset.cat = key;
    btn.textContent = `${val.icon} ${val.label} ${cnt}`;
    btn.onclick = () => setCat(btn);
    tagRow.appendChild(btn);
  }
  const statsBar = document.getElementById("statsBar");
  const abbrCount = G.filter(r => r.abbr).length;
  const iconCount = G.filter(r => r.icon).length;
  statsBar.innerHTML = `
    <span class="stat-chip">전체 <b>${G.length}</b>개</span>
    <span class="stat-chip">아이콘 <b>${iconCount}</b>개</span>
    <span class="stat-chip">약어 <b>${abbrCount}</b>개</span>
  `;
  render();
})();

function setCat(btn) {
  document.querySelectorAll(".cbtn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  curCat = btn.dataset.cat;
  render();
}
function setView(v, btn) {
  curView = v;
  document.querySelectorAll(".view-toggle button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  render();
}
function filter() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let f = G;
  if (curCat !== "all") f = f.filter(r => r.cat === curCat);
  if (q) f = f.filter(r =>
    (r.en||"").toLowerCase().includes(q) || (r.ko||"").toLowerCase().includes(q) ||
    (r.jp||"").toLowerCase().includes(q) || (r.abbr||"").toLowerCase().includes(q) ||
    (r.desc||"").toLowerCase().includes(q)
  );
  return f;
}

function render() {
  const filtered = filter();
  document.getElementById("info").textContent = `${filtered.length} / ${G.length}개 표시`;
  const noR = document.getElementById("noResult");
  const cardV = document.getElementById("cardView");
  const tblV = document.getElementById("tableView");

  if (!filtered.length) {
    cardV.style.display="none"; tblV.style.display="none"; noR.style.display="";
    return;
  }
  noR.style.display = "none";

  if (curView === "card") {
    cardV.style.display = ""; tblV.style.display = "none";
    cardV.innerHTML = filtered.map((r,i) => `
      <div class="card" onclick="openModal(${G.indexOf(r)})">
        <span class="cat-badge ${r.cat}">${CAT_LABELS[r.cat]}</span>
        <div class="card-top">
          <div class="card-icon">${renderIcon(r)}</div>
          <div class="card-titles">
            <div class="card-en">${r.en}${r.abbr?`<span class="card-abbr">${r.abbr}</span>`:""}</div>
          </div>
        </div>
        <div class="card-langs">
          <span class="card-lang"><span class="label">KO</span><span class="ko">${r.ko||"—"}</span></span>
          <span class="card-lang"><span class="label">JP</span><span class="jp">${r.jp||"—"}</span></span>
        </div>
        ${r.desc?`<div class="card-desc">${r.desc}</div>`:""}
      </div>`).join("");
  } else {
    cardV.style.display = "none"; tblV.style.display = "";
    document.getElementById("tbody").innerHTML = filtered.map((r) => `
      <tr onclick="openModal(${G.indexOf(r)})">
        <td class="td-icon">${renderIcon(r, 24)}</td>
        <td class="td-cat"><span class="cat-badge ${r.cat}">${CAT_LABELS[r.cat]}</span></td>
        <td class="td-en"><span class="term-en">${r.en}</span>${r.abbr?`<span class="card-abbr">${r.abbr}</span>`:""}</td>
        <td class="td-ko"><span class="term-ko">${r.ko||"—"}</span></td>
        <td class="td-jp"><span class="term-jp">${r.jp||"—"}</span></td>
        <td><span class="desc-text">${r.desc||""}</span></td>
      </tr>`).join("");
  }
}

// ── 모달 ──
function openModal(idx) {
  const r = G[idx];
  const m = document.getElementById("modal");
  let relHTML = "";
  if (r.rel && r.rel.length) {
    relHTML = `<div class="modal-related"><h4>관련 용어</h4><div class="related-tags">
      ${r.rel.map(t => `<span class="related-tag" onclick="searchTerm('${t.replace(/'/g,"\\'")}')">${t}</span>`).join("")}
    </div></div>`;
  }
  m.innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-icon-row">
      <div class="modal-icon">${renderIcon(r, 40)}</div>
      <div class="modal-title">
        <div class="modal-en">${r.en}${r.abbr?` <span class="card-abbr">${r.abbr}</span>`:""}</div>
        <span class="modal-cat-badge cat-badge ${r.cat}">${CAT_LABELS[r.cat]}</span>
      </div>
    </div>
    <div class="modal-langs">
      <span class="flag">KO</span><span class="val-ko">${r.ko||"—"}</span>
      <span class="flag">JP</span><span class="val-jp">${r.jp||"—"}</span>
    </div>
    <div class="modal-desc">${r.desc||""}</div>
    ${relHTML}
  `;
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}
function searchTerm(t) {
  closeModal();
  document.getElementById("q").value = t;
  curCat = "all";
  document.querySelectorAll(".cbtn").forEach(b => b.classList.toggle("on", b.dataset.cat === "all"));
  render();
  // 결과가 1개면 자동으로 모달 열기
  const f = filter();
  if (f.length === 1) { setTimeout(() => openModal(G.indexOf(f[0])), 150); }
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
</script>
